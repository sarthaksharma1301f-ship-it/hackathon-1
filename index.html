<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkGig — Creator Gig & Appointment Marketplace</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'xs': '0 1px 2px 0 rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>

  <!-- React 18 + ReactDOM + Babel Standalone for direct zero-friction execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-50 antialiased selection:bg-indigo-500 selection:text-white text-slate-900">
  
  <div id="root">
    <!-- Fallback while React compiles -->
    <div class="min-h-screen flex items-center justify-center p-6 text-slate-500">
      <div class="text-center space-y-3">
        <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs font-semibold tracking-wider uppercase text-slate-400">Loading SparkGig Marketplace...</p>
      </div>
    </div>
  </div>

  <!-- INLINED COMPLETE APPLICATION SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Local Storage Keys
    const STORAGE_KEYS = {
      USERS: 'cgm_users_v4',
      CURRENT_USER: 'cgm_current_user_v4',
      GIGS: 'cgm_gigs_v4',
      BOOKINGS: 'cgm_bookings_v4'
    };

    const CATEGORIES = [
      'Video Editing',
      'Graphic Design',
      'Content Writing',
      'Tutoring',
      'Web Development',
      'Voiceover',
      'Social Media'
    ];

    const INITIAL_USERS = [
      {
        id: 'usr_sarah',
        name: 'Sarah Chen',
        email: 'sarah.chen@creator.io',
        phone: '+1 (415) 555-0142',
        role: 'both',
        primaryRole: 'Creator',
        tagline: 'Video Editor & Motion Designer',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80'
      },
      {
        id: 'usr_marcus',
        name: 'Marcus Vance',
        email: 'marcus.v@designcraft.co',
        phone: '+1 (206) 555-0198',
        role: 'both',
        primaryRole: 'Creator',
        tagline: 'Brand Identity & Vector Designer',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80'
      },
      {
        id: 'usr_priya',
        name: 'Priya Patel',
        email: 'priya.codes@techguide.dev',
        phone: '+1 (650) 555-0176',
        role: 'both',
        primaryRole: 'Creator',
        tagline: 'Full-Stack Dev & Python Tutor',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
      }
    ];

    const INITIAL_GIGS = [
      {
        id: 'gig_1',
        creator_id: 'usr_sarah',
        title: 'Viral TikTok & Instagram Reels Video Editing (Hooks + Subtitles)',
        category: 'Video Editing',
        rate: 45,
        description: 'Transform your raw footage into fast-paced, high-retention vertical videos. Includes custom kinetic typography, engaging sound effects, zoom cuts, and color correction optimized for social algorithms.',
        turnaround: '24-48 Hours',
        deliverables: ['Up to 60s 9:16 Video', 'Dynamic captions & kinetic text', 'Licensed trending SFX', '1 Revision round'],
        status: 'active',
        created_at: '2026-09-18T18:30:00.000Z'
      },
      {
        id: 'gig_2',
        creator_id: 'usr_marcus',
        title: 'Minimalist Modern Logo & Visual Identity Kit',
        category: 'Graphic Design',
        rate: 120,
        description: 'Bespoke vector logo design tailored for creative entrepreneurs and indie brands. Deliverables include primary logo, sub-mark, color palette hex codes, typography pairings, and ready-to-use social avatars.',
        turnaround: '3-4 Days',
        deliverables: ['Vector SVG & PNG assets', 'Primary logo + Icon submark', 'Brand color guidelines', 'Commercial license'],
        status: 'active',
        created_at: '2026-09-18T17:15:00.000Z'
      },
      {
        id: 'gig_3',
        creator_id: 'usr_priya',
        title: '1-on-1 Python & Web Development Live Tutoring Session',
        category: 'Tutoring',
        rate: 55,
        description: 'Hands-on, friendly coding mentorship for beginners and intermediate coders. Learn React, JavaScript, or Python backend basics. We tackle your real assignment or personal portfolio project live on screen.',
        turnaround: 'Scheduled 60 Min',
        deliverables: ['60-minute Google Meet session', 'Screen share debugging', 'Annotated source code repo', 'Follow-up practice roadmap'],
        status: 'active',
        created_at: '2026-09-18T16:00:00.000Z'
      },
      {
        id: 'gig_4',
        creator_id: 'usr_sarah',
        title: 'Cinematic 4K YouTube Video Storytelling & Pacing Edit',
        category: 'Video Editing',
        rate: 175,
        description: 'Complete narrative editing for 10–20 minute YouTube videos. Multi-cam sync, B-roll sourcing, custom transition design, audio ducking, and click-worthy high-CTR thumbnail concept included.',
        turnaround: '3 Days',
        deliverables: ['Full 4K ProRes / MP4 export', 'Color grading & sound design', 'Custom YouTube thumbnail file', 'YouTube chapters timestamps'],
        status: 'active',
        created_at: '2026-09-18T14:20:00.000Z'
      },
      {
        id: 'gig_5',
        creator_id: 'usr_priya',
        title: 'Custom Fast Responsive Portfolio Website in Tailwind + React',
        category: 'Web Development',
        rate: 220,
        description: 'Get a clean, modern personal creator portfolio or agency site that loads in milliseconds. Fully responsive across iPhone, iPad, and desktop with sleek dark/light aesthetics and contact form integration.',
        turnaround: '5 Days',
        deliverables: ['Production React + Tailwind code', '100/100 Lighthouse performance', 'Vercel / Netlify deploy support', 'Mobile responsive layouts'],
        status: 'active',
        created_at: '2026-09-18T12:00:00.000Z'
      },
      {
        id: 'gig_6',
        creator_id: 'usr_marcus',
        title: 'Energetic Commercial Voiceover & Podcast Intro Audio',
        category: 'Voiceover',
        rate: 65,
        description: 'Broadcast-quality vocal recordings from a treated home studio. Clear, articulate, and youthful tone perfect for software explainer videos, podcast introductions, and YouTube sponsorships.',
        turnaround: '24 Hours',
        deliverables: ['24-bit 48kHz WAV audio files', 'Edited clean vocal track (no breaths)', '2 performance tone styles', 'Commercial broadcast rights'],
        status: 'active',
        created_at: '2026-09-18T09:00:00.000Z'
      }
    ];

    const INITIAL_BOOKINGS = [
      {
        id: 'bk_1001',
        gig_id: 'gig_1',
        client_id: 'usr_client_sample',
        client_name: 'David Miller',
        client_email: 'david.miller@example.com',
        client_phone: '+1 (555) 349-2918',
        appointment_date: '2026-09-22',
        appointment_slot: 'Afternoon (1 PM - 5 PM)',
        message: 'Need 3 short-form clips edited for our product launch video.',
        status: 'pending',
        created_at: '2026-09-18T20:10:00.000Z'
      }
    ];

    // LocalStorage Helper
    const LocalDB = {
      get(key, fallback) {
        try {
          const item = localStorage.getItem(key);
          return item !== null ? JSON.parse(item) : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {
          console.error(e);
        }
      }
    };

    function App() {
      // User Profile & Authentication States
      const [users, setUsers] = useState(() => LocalDB.get(STORAGE_KEYS.USERS, INITIAL_USERS));
      const [currentUser, setCurrentUser] = useState(() => LocalDB.get(STORAGE_KEYS.CURRENT_USER, null));

      // Onboarding / Sign In Form Inputs
      const [authFormTab, setAuthFormTab] = useState('register'); // 'register' | 'signin'
      const [inputName, setInputName] = useState('');
      const [inputEmail, setInputEmail] = useState('');
      const [inputPhone, setInputPhone] = useState('');
      const [inputRole, setInputRole] = useState('Client'); // 'Client' | 'Creator' | 'Both'
      const [inputTagline, setInputTagline] = useState('');
      const [signInIdentifier, setSignInIdentifier] = useState(''); // email or phone

      // Navigation & Marketplace States
      const [currentTab, setCurrentTab] = useState('browse'); // 'browse' | 'post' | 'dashboard' | 'my_bookings'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [sortBy, setSortBy] = useState('newest'); // 'newest' | 'price_low' | 'price_high'
      const [dashboardFilter, setDashboardFilter] = useState('all');
      const [myBookingsFilter, setMyBookingsFilter] = useState('all');

      // Modals
      const [showSwitchUserModal, setShowSwitchUserModal] = useState(false);
      const [gigDetailsModal, setGigDetailsModal] = useState(null);
      const [bookingTargetGig, setBookingTargetGig] = useState(null);
      const [bookingConfirmation, setBookingConfirmation] = useState(null);
      const [editingGig, setEditingGig] = useState(null);
      const [showJudgeModal, setShowJudgeModal] = useState(false);
      const [toast, setToast] = useState(null);

      // Data States
      const [gigs, setGigs] = useState(() => LocalDB.get(STORAGE_KEYS.GIGS, INITIAL_GIGS));
      const [bookings, setBookings] = useState(() => LocalDB.get(STORAGE_KEYS.BOOKINGS, INITIAL_BOOKINGS));

      // Booking Appointment Form
      const [appointmentForm, setAppointmentForm] = useState({
        name: '',
        email: '',
        phone: '',
        date: new Date(Date.now() + 86400000).toISOString().split('T')[0], // Tomorrow
        slot: 'Morning (9 AM - 12 PM)',
        message: ''
      });

      // Post Gig Form
      const [postGigForm, setPostGigForm] = useState({
        title: '',
        category: CATEGORIES[0],
        rate: '',
        description: '',
        turnaround: '24-48 Hours'
      });

      // Persistence
      useEffect(() => LocalDB.set(STORAGE_KEYS.USERS, users), [users]);
      useEffect(() => LocalDB.set(STORAGE_KEYS.CURRENT_USER, currentUser), [currentUser]);
      useEffect(() => LocalDB.set(STORAGE_KEYS.GIGS, gigs), [gigs]);
      useEffect(() => LocalDB.set(STORAGE_KEYS.BOOKINGS, bookings), [bookings]);

      // Toast Dismiss
      useEffect(() => {
        if (toast) {
          const t = setTimeout(() => setToast(null), 3600);
          return () => clearTimeout(t);
        }
      }, [toast]);

      const triggerConfetti = () => {
        try {
          if (window.confetti) {
            window.confetti({ particleCount: 50, spread: 70, origin: { y: 0.65 } });
          }
        } catch {}
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
      };

      const getUser = (id) => users.find(u => u.id === id) || { name: 'Creator', tagline: '', phone: '', email: '', avatar: '' };

      // Initialize appointment booking form when a gig is selected
      useEffect(() => {
        if (bookingTargetGig && currentUser) {
          setAppointmentForm({
            name: currentUser.name || '',
            email: currentUser.email || '',
            phone: currentUser.phone || '',
            date: new Date(Date.now() + 86400000).toISOString().split('T')[0],
            slot: 'Morning (9 AM - 12 PM)',
            message: ''
          });
        }
      }, [bookingTargetGig, currentUser]);

      // Auto-prompt onboarding if no profile is set
      useEffect(() => {
        if (!currentUser) {
          setShowSwitchUserModal(true);
        }
      }, []);

      // ==========================================
      // ONBOARDING / SIGN IN HANDLER (INPUT FORM)
      // ==========================================
      const handleRegisterUser = (e) => {
        e.preventDefault();
        if (!inputName.trim() || !inputEmail.trim() || !inputPhone.trim()) {
          showToast('Please enter your Name, Email, and Phone Number', 'error');
          return;
        }

        const newUser = {
          id: `usr_${Date.now()}`,
          name: inputName.trim(),
          email: inputEmail.trim().toLowerCase(),
          phone: inputPhone.trim(),
          role: 'both',
          primaryRole: inputRole,
          tagline: inputTagline.trim() || `${inputRole} on SparkGig`,
          avatar: `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80`
        };

        setUsers(prev => [...prev, newUser]);
        setCurrentUser(newUser);
        setShowSwitchUserModal(false);
        triggerConfetti();
        showToast(`Welcome, ${newUser.name}! Profile created.`);
        setCurrentTab('browse');
      };

      const handleSignInWithIdentifier = (e) => {
        e.preventDefault();
        const term = signInIdentifier.trim().toLowerCase();
        if (!term) {
          showToast('Please enter your email or phone number', 'error');
          return;
        }

        const matched = users.find(u => 
          u.email.toLowerCase() === term || 
          u.phone.replace(/[^0-9]/g, '') === term.replace(/[^0-9]/g, '')
        );

        if (matched) {
          setCurrentUser(matched);
          setShowSwitchUserModal(false);
          triggerConfetti();
          showToast(`Welcome back, ${matched.name}!`);
          setCurrentTab('browse');
        } else {
          // If not found, automatically register them smoothly
          const fallbackName = term.includes('@') ? term.split('@')[0] : 'Member';
          const newUser = {
            id: `usr_${Date.now()}`,
            name: fallbackName.replace(/\b\w/g, l => l.toUpperCase()),
            email: term.includes('@') ? term : `${fallbackName}@sparkgig.local`,
            phone: term.includes('@') ? '+1 (555) 000-0000' : term,
            role: 'both',
            primaryRole: 'Client',
            tagline: 'SparkGig Member',
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80'
          };
          setUsers(prev => [...prev, newUser]);
          setCurrentUser(newUser);
          setShowSwitchUserModal(false);
          triggerConfetti();
          showToast(`Account created for ${newUser.name}!`);
          setCurrentTab('browse');
        }
      };

      const handleSignOut = () => {
        setCurrentUser(null);
        setCurrentTab('browse');
        showToast('Signed out. Enter your details to start a session.', 'info');
      };

      // Handle protected actions (requires profile details)
      const handleProtectedTab = (tabName, featureTitle) => {
        if (!currentUser) {
          setShowSwitchUserModal(true);
          showToast(`Please enter your Name, Email, and Phone to access ${featureTitle}.`, 'info');
        } else {
          setCurrentTab(tabName);
        }
      };

      const handleInitiateBooking = (gig) => {
        if (!currentUser) {
          setBookingTargetGig(gig);
          setShowSwitchUserModal(true);
          showToast('Please enter your contact details first so the creator can reach you.', 'info');
        } else {
          setBookingTargetGig(gig);
        }
      };

      // Post Gig Submit
      const handlePostGigSubmit = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowSwitchUserModal(true);
          return;
        }

        if (!postGigForm.title.trim() || !postGigForm.rate || !postGigForm.description.trim()) {
          showToast('Please complete all required gig fields', 'error');
          return;
        }

        const newGig = {
          id: `gig_${Date.now()}`,
          creator_id: currentUser.id,
          title: postGigForm.title.trim(),
          category: postGigForm.category,
          rate: Number(postGigForm.rate),
          description: postGigForm.description.trim(),
          turnaround: postGigForm.turnaround || '24-48 Hours',
          deliverables: ['Custom project deliverables', 'High-res exports', '1 Revision round'],
          status: 'active',
          created_at: new Date().toISOString()
        };

        setGigs(prev => [newGig, ...prev]);
        setPostGigForm({
          title: '',
          category: CATEGORIES[0],
          rate: '',
          description: '',
          turnaround: '24-48 Hours'
        });
        setCurrentTab('browse');
        triggerConfetti();
        showToast(`Gig "${newGig.title.substring(0, 26)}..." posted! Visible to all clients.`);
      };

      // Appointment Booking Submit (Req 4.3)
      const handleBookAppointmentSubmit = (e) => {
        e.preventDefault();
        if (!bookingTargetGig) return;

        const newBooking = {
          id: `bk_${Math.floor(1000 + Math.random() * 9000)}`,
          gig_id: bookingTargetGig.id,
          client_id: currentUser ? currentUser.id : `usr_${Date.now()}`,
          client_name: appointmentForm.name.trim(),
          client_email: appointmentForm.email.trim(),
          client_phone: appointmentForm.phone.trim(),
          appointment_date: appointmentForm.date,
          appointment_slot: appointmentForm.slot,
          message: appointmentForm.message.trim(),
          status: 'pending',
          created_at: new Date().toISOString()
        };

        setBookings(prev => [newBooking, ...prev]);
        const target = bookingTargetGig;
        setBookingTargetGig(null);
        setBookingConfirmation({ booking: newBooking, gig: target });
        triggerConfetti();
        showToast(`Appointment Request ${newBooking.id} submitted as Pending!`);
      };

      // Creator Booking Action (Accept / Decline)
      const handleBookingAction = (bookingId, newStatus) => {
        setBookings(prev => prev.map(b => {
          if (b.id === bookingId && b.status === 'pending') {
            return { ...b, status: newStatus, resolved_at: new Date().toISOString() };
          }
          return b;
        }));

        if (newStatus === 'accepted') {
          triggerConfetti();
          showToast(`Appointment ${bookingId} Accepted! Confirmed for creator & client.`);
        } else {
          showToast(`Appointment ${bookingId} Declined. Record preserved per DP1.`, 'info');
        }
      };

      // Filtered & Sorted Gigs
      const filteredGigs = useMemo(() => {
        return gigs
          .filter(g => g.status === 'active')
          .filter(g => {
            const matchesCat = selectedCategory === 'All' || g.category === selectedCategory;
            const matchesQuery = !searchQuery.trim() ||
              g.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
              g.description.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCat && matchesQuery;
          })
          .sort((a, b) => {
            if (sortBy === 'price_low') return a.rate - b.rate;
            if (sortBy === 'price_high') return b.rate - a.rate;
            return new Date(b.created_at) - new Date(a.created_at); // DP3 Newest First
          });
      }, [gigs, selectedCategory, searchQuery, sortBy]);

      // Category Count Map
      const categoryCounts = useMemo(() => {
        const counts = { All: gigs.filter(g => g.status === 'active').length };
        CATEGORIES.forEach(c => {
          counts[c] = gigs.filter(g => g.status === 'active' && g.category === c).length;
        });
        return counts;
      }, [gigs]);

      // Creator Dashboard Bookings
      const creatorBookings = useMemo(() => {
        if (!currentUser) return [];
        const myGigIds = new Set(gigs.filter(g => g.creator_id === currentUser.id).map(g => g.id));
        return bookings
          .filter(b => myGigIds.has(b.gig_id))
          .filter(b => dashboardFilter === 'all' ? true : b.status === dashboardFilter)
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }, [bookings, gigs, currentUser, dashboardFilter]);

      const pendingCreatorCount = useMemo(() => {
        if (!currentUser) return 0;
        const myGigIds = new Set(gigs.filter(g => g.creator_id === currentUser.id).map(g => g.id));
        return bookings.filter(b => myGigIds.has(b.gig_id) && b.status === 'pending').length;
      }, [bookings, gigs, currentUser]);

      // Client Bookings
      const clientBookings = useMemo(() => {
        if (!currentUser) return [];
        return bookings
          .filter(b => b.client_id === currentUser.id || b.client_email === currentUser.email)
          .filter(b => myBookingsFilter === 'all' ? true : b.status === myBookingsFilter)
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }, [bookings, currentUser, myBookingsFilter]);

      const creatorGigs = useMemo(() => {
        if (!currentUser) return [];
        return gigs
          .filter(g => g.creator_id === currentUser.id)
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }, [gigs, currentUser]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans pb-20">
          
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-sm font-semibold border backdrop-blur-md transition-all animate-in fade-in ${
              toast.type === 'error'
                ? 'bg-rose-900/95 text-rose-100 border-rose-700'
                : toast.type === 'info'
                ? 'bg-slate-900/95 text-sky-200 border-slate-700'
                : 'bg-slate-900/95 text-emerald-300 border-emerald-500/40'
            }`}>
              <span className="w-2.5 h-2.5 rounded-full bg-current animate-ping"></span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* Top Bar with Hackathon Judging Rubric & Quick Status */}
          <div className="bg-slate-900 text-white text-xs border-b border-slate-800 shadow-sm sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 px-2 py-0.5 rounded font-bold text-[10px] uppercase tracking-wider">
                  ⚡ SparkGig Hackathon MVP
                </span>
                <span className="text-slate-300 font-medium hidden sm:inline">Creator Economy Marketplace</span>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowJudgeModal(true)}
                  className="flex items-center gap-1.5 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 px-3 py-1 rounded-md font-black hover:brightness-105 transition-all shadow-xs"
                >
                  <span>🏆 Decision Points (20 pts)</span>
                </button>
                {currentUser ? (
                  <span className="text-emerald-400 font-medium text-[11px] hidden md:inline">
                    ● Active: {currentUser.name} ({currentUser.phone})
                  </span>
                ) : (
                  <button
                    onClick={() => setShowSwitchUserModal(true)}
                    className="text-amber-300 hover:text-white underline text-[11px]"
                  >
                    Enter your details to sign in
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Main Navbar */}
          <header className="bg-white border-b border-slate-200 sticky top-9 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 gap-4">
                
                {/* Brand */}
                <div
                  className="flex items-center gap-3 cursor-pointer group"
                  onClick={() => setCurrentTab('browse')}
                >
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-700 to-violet-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-indigo-100 group-hover:scale-105 transition-transform">
                    ⚡
                  </div>
                  <div>
                    <span className="text-xl font-black tracking-tight bg-gradient-to-r from-indigo-600 to-violet-700 bg-clip-text text-transparent">
                      SparkGig
                    </span>
                    <span className="hidden md:inline-block ml-2 text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">
                      Marketplace
                    </span>
                  </div>
                </div>

                {/* Navigation Tabs */}
                <nav className="flex items-center gap-1 sm:gap-2">
                  <button
                    onClick={() => setCurrentTab('browse')}
                    className={`px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                      currentTab === 'browse'
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    🔍 Browse Gigs
                  </button>

                  <button
                    onClick={() => handleProtectedTab('post', 'Post a Gig')}
                    className={`px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                      currentTab === 'post'
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    ➕ Post a Gig
                  </button>

                  <button
                    onClick={() => handleProtectedTab('dashboard', 'Creator Dashboard')}
                    className={`relative px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                      currentTab === 'dashboard'
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    📊 Creator Dashboard
                    {pendingCreatorCount > 0 && (
                      <span className="ml-1.5 inline-flex items-center justify-center px-1.5 py-0.5 text-[10px] font-black leading-none text-white bg-amber-500 rounded-full animate-pulse">
                        {pendingCreatorCount}
                      </span>
                    )}
                  </button>

                  <button
                    onClick={() => handleProtectedTab('my_bookings', 'My Bookings')}
                    className={`px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                      currentTab === 'my_bookings'
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    📋 My Bookings
                    {clientBookings.length > 0 && (
                      <span className={`ml-1.5 text-xs font-semibold ${currentTab === 'my_bookings' ? 'text-indigo-200' : 'text-slate-400'}`}>
                        ({clientBookings.length})
                      </span>
                    )}
                  </button>
                </nav>

                {/* USER PROFILE / CONTACT DETAILS */}
                <div className="flex items-center gap-2">
                  {!currentUser ? (
                    <button
                      onClick={() => setShowSwitchUserModal(true)}
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md shadow-indigo-100 transition-all flex items-center gap-1.5"
                    >
                      <span>👤 Enter Details / Sign In</span>
                    </button>
                  ) : (
                    <div className="relative group">
                      <button className="flex items-center gap-2.5 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-3 py-1.5 rounded-2xl cursor-pointer transition-all">
                        <img
                          src={currentUser.avatar}
                          alt={currentUser.name}
                          className="w-8 h-8 rounded-full object-cover ring-2 ring-indigo-500"
                        />
                        <div className="text-left hidden md:block">
                          <p className="text-xs font-bold text-slate-900 leading-none flex items-center gap-1">
                            {currentUser.name}
                            <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.2 rounded font-semibold">
                              {currentUser.primaryRole || 'Member'}
                            </span>
                          </p>
                          <p className="text-[10px] text-slate-500 font-mono truncate max-w-[120px]">{currentUser.phone}</p>
                        </div>
                        <span className="text-xs text-slate-400">▼</span>
                      </button>

                      {/* User Menu Dropdown */}
                      <div className="absolute right-0 mt-1 w-72 bg-white rounded-2xl shadow-2xl border border-slate-200 py-3 hidden group-hover:block z-50 animate-in fade-in">
                        <div className="px-4 pb-2.5 border-b border-slate-100 space-y-1">
                          <p className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Active Personal Details</p>
                          <p className="text-xs font-bold text-slate-900">{currentUser.name}</p>
                          <p className="text-xs text-slate-600 flex items-center gap-1">
                            <span>📧</span> <span className="font-mono text-[11px]">{currentUser.email}</span>
                          </p>
                          <p className="text-xs text-slate-600 flex items-center gap-1">
                            <span>📱</span> <span className="font-mono text-[11px]">{currentUser.phone}</span>
                          </p>
                          <p className="text-[11px] text-indigo-600 font-semibold mt-1">Role: {currentUser.primaryRole || 'Creator & Client'}</p>
                        </div>

                        <div className="p-2 space-y-1">
                          <button
                            onClick={() => setShowSwitchUserModal(true)}
                            className="w-full text-left text-xs font-bold py-2 px-3 rounded-xl hover:bg-indigo-50 text-indigo-700 transition-colors flex items-center gap-2"
                          >
                            <span>🔄</span>
                            <span>Switch Account / Enter New Details</span>
                          </button>
                          <button
                            onClick={handleSignOut}
                            className="w-full text-left text-xs font-bold py-2 px-3 rounded-xl hover:bg-rose-50 text-rose-600 transition-colors flex items-center gap-2"
                          >
                            <span>🚪</span>
                            <span>Sign Out</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

              </div>
            </div>
          </header>

          {/* MAIN APPLICATION CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            {/* ========================================================= */}
            {/* VIEW 1: BROWSE & SEARCH (PUBLIC HOME PAGE) */}
            {/* ========================================================= */}
            {currentTab === 'browse' && (
              <div className="space-y-8">
                
                {/* Hero Banner */}
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white p-8 sm:p-12 shadow-2xl">
                  <div className="relative z-10 max-w-2xl space-y-4">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-bold">
                      <span>🚀 Two-Sided Marketplace</span>
                      <span>•</span>
                      <span>Book Appointments & Gigs Instantly</span>
                    </div>

                    <h1 className="text-3xl sm:text-5xl font-black tracking-tight leading-tight">
                      Book Top Creators & Appointments in Under 60 Seconds
                    </h1>

                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                      Discover skilled video editors, graphic designers, copywriters, and coding tutors. Choose your preferred date and time slot, and submit booking requests with transparent rates.
                    </p>

                    {/* Live Search Input */}
                    <div className="pt-3">
                      <div className="relative w-full max-w-xl">
                        <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 text-lg pointer-events-none">
                          🔍
                        </span>
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="Search services, skills, deliverables (e.g. video, logo, python, tutoring)..."
                          className="w-full pl-12 pr-12 py-3.5 rounded-2xl bg-white/10 text-white placeholder-slate-400 border border-white/20 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white/20 text-sm backdrop-blur-md transition-all shadow-inner"
                        />
                        {searchQuery && (
                          <button
                            onClick={() => setSearchQuery('')}
                            className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white text-xs font-bold"
                          >
                            ✕
                          </button>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="absolute -right-24 -top-24 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
                  <div className="absolute right-8 bottom-4 opacity-10 text-9xl font-black select-none pointer-events-none text-white">
                    GIGS
                  </div>
                </div>

                {/* Filters & Sorting Bar */}
                <div className="space-y-3 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    
                    {/* Category Filter Pills */}
                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none flex-1">
                      <button
                        onClick={() => setSelectedCategory('All')}
                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 ${
                          selectedCategory === 'All'
                            ? 'bg-slate-900 text-white shadow-sm'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        <span>✨ All</span>
                        <span className="text-[10px] opacity-80 font-mono">({categoryCounts.All})</span>
                      </button>

                      {CATEGORIES.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 ${
                            selectedCategory === cat
                              ? 'bg-indigo-600 text-white shadow-sm'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          <span>{cat}</span>
                          <span className="text-[10px] opacity-80 font-mono">({categoryCounts[cat] || 0})</span>
                        </button>
                      ))}
                    </div>

                    {/* Sort Selector */}
                    <div className="flex items-center gap-2 shrink-0">
                      <span className="text-xs text-slate-500 font-semibold">Sort by:</span>
                      <select
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                        className="bg-slate-100 text-slate-800 text-xs font-bold py-1.5 px-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="newest">🕒 Newest First (DP3 Default)</option>
                        <option value="price_low">💰 Price: Low to High</option>
                        <option value="price_high">💎 Price: High to Low</option>
                      </select>
                    </div>

                  </div>
                </div>

                {/* Gigs Grid */}
                {filteredGigs.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8 space-y-4 shadow-xs">
                    <div className="text-5xl">🔍</div>
                    <h3 className="text-lg font-bold text-slate-800">No active services match your search</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      Try clearing your search query or selecting another category to see available listings.
                    </p>
                    <div className="flex justify-center gap-3 pt-2">
                      <button
                        onClick={() => { setSearchQuery(''); setSelectedCategory('All'); }}
                        className="px-4 py-2 text-xs font-bold rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700"
                      >
                        Reset All Filters
                      </button>
                      <button
                        onClick={() => handleProtectedTab('post', 'Post a Gig')}
                        className="px-4 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white"
                      >
                        + Post a Service in this Category
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredGigs.map(gig => {
                      const creator = getUser(gig.creator_id);
                      const isOwnGig = currentUser && gig.creator_id === currentUser.id;

                      return (
                        <div
                          key={gig.id}
                          className="bg-white rounded-3xl border border-slate-200/90 shadow-xs hover:shadow-xl transition-all duration-300 flex flex-col justify-between overflow-hidden group hover:border-indigo-300"
                        >
                          <div className="p-6 space-y-4">
                            <div className="flex items-center justify-between gap-2">
                              <span className="px-3 py-1 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100">
                                {gig.category}
                              </span>
                              <div className="text-right">
                                <span className="text-xl font-black text-slate-900">${gig.rate}</span>
                                <span className="text-xs text-slate-400 font-medium ml-1">/ appointment</span>
                              </div>
                            </div>

                            <h3
                              onClick={() => setGigDetailsModal(gig)}
                              className="text-base font-bold text-slate-900 line-clamp-2 cursor-pointer group-hover:text-indigo-600 transition-colors"
                            >
                              {gig.title}
                            </h3>

                            <p className="text-xs text-slate-600 line-clamp-3 leading-relaxed">
                              {gig.description}
                            </p>

                            <div className="flex items-center gap-2 text-[11px] text-slate-500 font-medium pt-1">
                              <span>⏱️ Turnaround:</span>
                              <span className="font-semibold text-slate-700">{gig.turnaround || '24-48 Hours'}</span>
                            </div>
                          </div>

                          <div className="p-6 pt-0 border-t border-slate-100 bg-slate-50/50 mt-auto">
                            <div className="flex items-center justify-between pt-4">
                              <div
                                onClick={() => setGigDetailsModal(gig)}
                                className="flex items-center gap-2.5 cursor-pointer"
                              >
                                <img
                                  src={creator.avatar}
                                  alt={creator.name}
                                  className="w-9 h-9 rounded-full object-cover ring-2 ring-white shadow-xs"
                                />
                                <div>
                                  <p className="text-xs font-bold text-slate-900 leading-tight">{creator.name}</p>
                                  <p className="text-[10px] text-slate-500 truncate max-w-[120px]">{creator.tagline}</p>
                                </div>
                              </div>

                              <div className="flex items-center gap-2">
                                <button
                                  onClick={() => setGigDetailsModal(gig)}
                                  className="px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 text-xs font-bold transition-colors"
                                >
                                  Details
                                </button>
                                {isOwnGig ? (
                                  <span className="px-3 py-1.5 rounded-xl bg-slate-200 text-slate-700 text-xs font-bold">
                                    Your Gig
                                  </span>
                                ) : (
                                  <button
                                    onClick={() => handleInitiateBooking(gig)}
                                    className="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold shadow-md shadow-indigo-100 transition-all flex items-center gap-1"
                                  >
                                    <span>📅 Book Appointment →</span>
                                  </button>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            )}

            {/* ========================================================= */}
            {/* VIEW 2: POST A GIG (CREATOR) */}
            {/* ========================================================= */}
            {currentTab === 'post' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white rounded-3xl border border-slate-200 p-8 shadow-xs space-y-6">
                  
                  <div className="flex items-start justify-between gap-4 border-b border-slate-100 pb-6">
                    <div>
                      <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Creator Fast-Publish</span>
                      <h2 className="text-2xl font-black text-slate-900">Post a Gig in Under 60 Seconds</h2>
                      <p className="text-xs text-slate-500 mt-1">
                        Active immediately upon submit. Clients can view your rates and book appointments directly.
                      </p>
                    </div>

                    <button
                      type="button"
                      onClick={() => {
                        setPostGigForm({
                          title: 'Professional YouTube 4K Storytelling Video Editing & SFX',
                          category: 'Video Editing',
                          rate: '75',
                          turnaround: '24-48 Hours',
                          description: 'Full narrative edit with color grading, dynamic sound design, audio leveling, and high-retention cuts.'
                        });
                        showToast('Sample gig values populated!', 'info');
                      }}
                      className="px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold border border-amber-200 transition-colors shrink-0"
                    >
                      ⚡ Fill Preset
                    </button>
                  </div>

                  {/* Creator Identity Info */}
                  {currentUser && (
                    <div className="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4 flex items-center gap-3">
                      <img src={currentUser.avatar} alt={currentUser.name} className="w-10 h-10 rounded-full object-cover ring-2 ring-indigo-300" />
                      <div className="text-xs text-indigo-950">
                        Posting as <strong>{currentUser.name}</strong> • Phone: <strong>{currentUser.phone}</strong>
                        <span className="block text-indigo-700/80 text-[11px] mt-0.5">
                          Incoming client appointment requests will appear in your Creator Dashboard.
                        </span>
                      </div>
                    </div>
                  )}

                  <form onSubmit={handlePostGigSubmit} className="space-y-5">
                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1.5">
                        Gig / Service Title <span className="text-rose-500">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={postGigForm.title}
                        onChange={(e) => setPostGigForm({ ...postGigForm, title: e.target.value })}
                        placeholder="e.g. YouTube Video Editing with Captions & Sound Effects"
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1.5">
                          Category <span className="text-rose-500">*</span>
                        </label>
                        <select
                          value={postGigForm.category}
                          onChange={(e) => setPostGigForm({ ...postGigForm, category: e.target.value })}
                          className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium bg-white"
                        >
                          {CATEGORIES.map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1.5">
                          Rate ($ USD) <span className="text-rose-500">*</span>
                        </label>
                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 font-bold text-sm">$</span>
                          <input
                            type="number"
                            min="5"
                            max="10000"
                            required
                            value={postGigForm.rate}
                            onChange={(e) => setPostGigForm({ ...postGigForm, rate: e.target.value })}
                            placeholder="65"
                            className="w-full pl-8 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                          />
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1.5">
                        Typical Turnaround Timeline
                      </label>
                      <input
                        type="text"
                        value={postGigForm.turnaround}
                        onChange={(e) => setPostGigForm({ ...postGigForm, turnaround: e.target.value })}
                        placeholder="e.g. 24-48 Hours"
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1.5">
                        Service Description & Deliverables <span className="text-rose-500">*</span>
                      </label>
                      <textarea
                        required
                        rows="4"
                        value={postGigForm.description}
                        onChange={(e) => setPostGigForm({ ...postGigForm, description: e.target.value })}
                        placeholder="Describe what you will provide, your tools, and requirements from the client..."
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                      ></textarea>
                    </div>

                    <div className="pt-2 flex items-center justify-end gap-3">
                      <button
                        type="button"
                        onClick={() => setCurrentTab('browse')}
                        className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-lg shadow-indigo-100 active:scale-95 transition-all"
                      >
                        Publish Gig Now →
                      </button>
                    </div>
                  </form>

                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* VIEW 3: CREATOR DASHBOARD */}
            {/* ========================================================= */}
            {currentTab === 'dashboard' && (
              <div className="space-y-8">
                
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Creator Dashboard</span>
                    <h2 className="text-2xl font-black text-slate-900">Incoming Bookings & Gig Management</h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Logged in as <strong>{currentUser ? currentUser.name : 'Creator'}</strong> • Phone: {currentUser ? currentUser.phone : 'N/A'}. Accept or decline appointments.
                    </p>
                  </div>

                  <button
                    onClick={() => setCurrentTab('post')}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs transition-all"
                  >
                    + Post Another Gig
                  </button>
                </div>

                {/* Metrics */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
                    <span className="text-xs font-semibold text-slate-500">Your Active Gigs</span>
                    <p className="text-2xl font-black text-slate-900 mt-1">{creatorGigs.length}</p>
                  </div>

                  <div className="bg-white p-5 rounded-3xl border border-amber-200 bg-amber-50/30 shadow-xs">
                    <span className="text-xs font-semibold text-amber-700 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                      Pending Inquiries
                    </span>
                    <p className="text-2xl font-black text-amber-600 mt-1">{pendingCreatorCount}</p>
                  </div>

                  <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
                    <span className="text-xs font-semibold text-emerald-600">Accepted Bookings</span>
                    <p className="text-2xl font-black text-emerald-700 mt-1">
                      {creatorBookings.filter(b => b.status === 'accepted').length}
                    </p>
                  </div>

                  <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
                    <span className="text-xs font-semibold text-slate-500">Total Inquiries</span>
                    <p className="text-2xl font-black text-slate-900 mt-1">{creatorBookings.length}</p>
                  </div>
                </div>

                {/* Incoming Bookings Table */}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
                  <div className="p-6 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <h3 className="text-lg font-black text-slate-900">Incoming Client Appointments</h3>
                      <p className="text-xs text-slate-500">
                        Review client name, contact phone number, preferred appointment slot, and project message.
                      </p>
                    </div>

                    <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
                      {['all', 'pending', 'accepted', 'declined'].map(f => (
                        <button
                          key={f}
                          onClick={() => setDashboardFilter(f)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold capitalize transition-all ${
                            dashboardFilter === f ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>
                  </div>

                  {creatorBookings.length === 0 ? (
                    <div className="p-12 text-center space-y-3">
                      <div className="text-4xl">📬</div>
                      <h4 className="text-sm font-bold text-slate-700">No incoming bookings match this filter</h4>
                      <p className="text-xs text-slate-500 max-w-sm mx-auto">
                        When clients book an appointment for your services, their details will appear here instantly.
                      </p>
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100 overflow-x-auto">
                      {creatorBookings.map(bk => {
                        const gig = gigs.find(g => g.id === bk.gig_id) || { title: 'Unknown Gig', category: 'N/A', rate: 0 };
                        const isPending = bk.status === 'pending';

                        return (
                          <div
                            key={bk.id}
                            className="p-6 hover:bg-slate-50/70 transition-colors flex flex-col md:flex-row items-start md:items-center justify-between gap-5"
                          >
                            <div className="space-y-2 flex-1 min-w-0">
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="font-mono text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                                  {bk.id}
                                </span>
                                <h4 className="text-sm font-bold text-slate-900 truncate">
                                  {gig.title}
                                </h4>
                                <span className="text-xs text-slate-400 font-medium">
                                  • {new Date(bk.created_at).toLocaleDateString()}
                                </span>
                              </div>

                              {/* Client Contact & Appointment Details */}
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs bg-slate-50/80 p-3 rounded-2xl border border-slate-100">
                                <div>
                                  <p className="font-bold text-slate-900">👤 Client: {bk.client_name}</p>
                                  <p className="text-slate-600 font-mono text-[11px]">📱 Phone: <strong>{bk.client_phone}</strong></p>
                                  <p className="text-slate-600 font-mono text-[11px]">📧 Email: {bk.client_email}</p>
                                </div>
                                <div>
                                  <p className="font-bold text-indigo-900">📅 Preferred Date: {bk.appointment_date}</p>
                                  <p className="text-indigo-800 text-[11px]">⏰ Slot: {bk.appointment_slot}</p>
                                  <p className="text-slate-700 font-bold mt-0.5">Value: ${gig.rate}</p>
                                </div>
                              </div>

                              {bk.message ? (
                                <p className="text-xs text-slate-700 italic bg-white p-2.5 rounded-xl border border-slate-200">
                                  Client Note: "{bk.message}"
                                </p>
                              ) : (
                                <p className="text-xs text-slate-400 italic">No custom note provided.</p>
                              )}
                            </div>

                            {/* Actions */}
                            <div className="flex items-center gap-2.5 shrink-0 self-end md:self-center">
                              {isPending ? (
                                <div className="flex items-center gap-2">
                                  <button
                                    onClick={() => handleBookingAction(bk.id, 'accepted')}
                                    className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold shadow-md shadow-emerald-100 transition-all flex items-center gap-1"
                                  >
                                    <span>✓ Accept</span>
                                  </button>
                                  <button
                                    onClick={() => handleBookingAction(bk.id, 'declined')}
                                    className="px-4 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 active:scale-95 text-xs font-bold transition-all flex items-center gap-1"
                                  >
                                    <span>✕ Decline</span>
                                  </button>
                                </div>
                              ) : bk.status === 'accepted' ? (
                                <span className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1">
                                  ✓ Accepted
                                </span>
                              ) : (
                                <span className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-1">
                                  ✕ Declined
                                </span>
                              )}
                            </div>

                          </div>
                        );
                      })}
                    </div>
                  )}

                </div>

                {/* Listed Gigs by Current User */}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-xs p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-lg font-black text-slate-900">Your Listed Gigs ({creatorGigs.length})</h3>
                      <p className="text-xs text-slate-500">Manage services you currently offer to clients.</p>
                    </div>
                  </div>

                  {creatorGigs.length === 0 ? (
                    <div className="p-8 text-center text-xs text-slate-500">
                      You have not posted any gigs yet. Click "Post Another Gig" above to list your first service!
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {creatorGigs.map(g => (
                        <div key={g.id} className="p-5 rounded-2xl border border-slate-200 bg-slate-50/60 flex flex-col justify-between gap-3">
                          <div>
                            <div className="flex items-center justify-between gap-2">
                              <span className="text-[11px] font-bold text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-md border border-indigo-100">
                                {g.category}
                              </span>
                              <span className="text-base font-black text-slate-900">${g.rate}</span>
                            </div>
                            <h4 className="text-sm font-bold text-slate-900 mt-2 line-clamp-1">{g.title}</h4>
                            <p className="text-xs text-slate-500 line-clamp-2 mt-1">{g.description}</p>
                          </div>

                          <div className="flex items-center justify-between border-t border-slate-200/70 pt-3">
                            <span className="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active
                            </span>
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => setEditingGig(g)}
                                className="px-3 py-1 rounded-xl text-xs font-bold bg-white border border-slate-200 hover:bg-slate-100 text-slate-700"
                              >
                                Edit
                              </button>
                              <button
                                onClick={() => {
                                  if (confirm('Delete this gig listing?')) {
                                    setGigs(prev => prev.filter(item => item.id !== g.id));
                                    showToast('Gig listing removed.');
                                  }
                                }}
                                className="px-3 py-1 rounded-xl text-xs font-bold bg-white border border-rose-200 hover:bg-rose-50 text-rose-600"
                              >
                                Delete
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* ========================================================= */}
            {/* VIEW 4: MY BOOKINGS (CLIENT) */}
            {/* ========================================================= */}
            {currentTab === 'my_bookings' && (
              <div className="space-y-6">
                
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Client Center</span>
                    <h2 className="text-2xl font-black text-slate-900">My Booked Appointments</h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Logged in as <strong>{currentUser ? currentUser.name : 'Client'}</strong> • Track status of services and appointments you have booked.
                    </p>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="flex items-center gap-1 bg-slate-200/70 p-1 rounded-xl text-xs font-bold">
                      {['all', 'pending', 'accepted', 'declined'].map(f => (
                        <button
                          key={f}
                          onClick={() => setMyBookingsFilter(f)}
                          className={`px-3 py-1 rounded-lg capitalize transition-all ${
                            myBookingsFilter === f ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => setCurrentTab('browse')}
                      className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm"
                    >
                      🔍 Browse Gigs
                    </button>
                  </div>
                </div>

                {/* DP1 Banner */}
                <div className="bg-indigo-50/80 border border-indigo-100 rounded-2xl p-4 flex items-start gap-3">
                  <span className="text-xl">💡</span>
                  <div className="text-xs text-indigo-900 leading-relaxed">
                    <strong>Decision Point 1 (DP1) in Action:</strong> Declined bookings remain permanent records in your dashboard. You can click <strong>"🔄 Re-book this Gig"</strong> to submit another request instantly with zero restriction.
                  </div>
                </div>

                {clientBookings.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8 space-y-4 shadow-xs">
                    <div className="text-4xl">📑</div>
                    <h3 className="text-base font-bold text-slate-800">No appointments found for this filter</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      Explore active listings on Browse & Search, pick your preferred date/time slot, and book an appointment.
                    </p>
                    <button
                      onClick={() => setCurrentTab('browse')}
                      className="px-5 py-2.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm"
                    >
                      Browse Active Gigs
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {clientBookings.map(bk => {
                      const gig = gigs.find(g => g.id === bk.gig_id) || { title: 'Service Listing', category: 'N/A', rate: 0, creator_id: null };
                      const creator = getUser(gig.creator_id);

                      return (
                        <div
                          key={bk.id}
                          className="bg-white rounded-3xl border border-slate-200 p-6 shadow-xs flex flex-col md:flex-row items-start md:items-center justify-between gap-5 hover:border-indigo-200 transition-all"
                        >
                          <div className="space-y-2 flex-1 min-w-0">
                            <div className="flex flex-wrap items-center gap-2">
                              <span className="font-mono text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded border border-indigo-100">
                                {bk.id}
                              </span>
                              <span className="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-700">
                                {gig.category}
                              </span>
                              <h4 className="text-base font-bold text-slate-900 truncate">
                                {gig.title}
                              </h4>
                            </div>

                            <div className="flex items-center gap-3 text-xs text-slate-600">
                              <div className="flex items-center gap-1.5 font-medium">
                                <img src={creator.avatar} alt={creator.name} className="w-5 h-5 rounded-full object-cover" />
                                <span>Creator: <strong>{creator.name}</strong></span>
                              </div>
                              <span>•</span>
                              <span className="font-bold text-slate-900">${gig.rate}</span>
                              <span>•</span>
                              <span className="text-indigo-700 font-semibold">
                                📅 Appointment: {bk.appointment_date} ({bk.appointment_slot})
                              </span>
                            </div>

                            {bk.message && (
                              <p className="text-xs text-slate-600 bg-slate-50 p-3 rounded-2xl border border-slate-100 italic">
                                Your message: "{bk.message}"
                              </p>
                            )}
                          </div>

                          <div className="flex flex-col items-end gap-2 shrink-0 self-end md:self-center">
                            {bk.status === 'pending' && (
                              <span className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200">
                                <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                                Pending Creator Review
                              </span>
                            )}

                            {bk.status === 'accepted' && (
                              <span className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                ✓ Appointment Accepted!
                              </span>
                            )}

                            {bk.status === 'declined' && (
                              <div className="flex flex-col items-end gap-1.5">
                                <span className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200">
                                  ✕ Request Declined
                                </span>
                                <button
                                  onClick={() => {
                                    const target = gigs.find(g => g.id === bk.gig_id);
                                    if (target) handleInitiateBooking(target);
                                    else setCurrentTab('browse');
                                  }}
                                  className="text-xs font-bold text-indigo-600 hover:text-indigo-800 underline flex items-center gap-1"
                                >
                                  <span>🔄 Re-book this Gig</span>
                                </button>
                              </div>
                            )}

                          </div>

                        </div>
                      );
                    })}
                  </div>
                )}

              </div>
            )}

          </main>

          {/* ========================================================= */}
          {/* MODAL / SCREEN: ENTER PERSONAL DETAILS / SIGN IN */}
          {/* ========================================================= */}
          {showSwitchUserModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-xs animate-in fade-in overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-6 my-8">
                
                {/* Header */}
                <div className="flex items-start justify-between gap-4 border-b border-slate-100 pb-4">
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-xs font-extrabold uppercase tracking-wide">
                      ⚡ Identification & Contact Details
                    </div>
                    <h3 className="text-2xl font-black text-slate-900 mt-1">
                      {authFormTab === 'register' ? 'Enter Your Personal Details' : 'Sign In with Email or Phone'}
                    </h3>
                    <p className="text-xs text-slate-500 mt-1">
                      {authFormTab === 'register'
                        ? 'Provide your name, email, and phone number to book appointments and manage gigs.'
                        : 'Enter your registered email address or phone number.'}
                    </p>
                  </div>
                  <button onClick={() => setShowSwitchUserModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">
                    ✕
                  </button>
                </div>

                {/* Tab Switcher */}
                <div className="flex items-center bg-slate-100 p-1 rounded-2xl">
                  <button
                    onClick={() => setAuthFormTab('register')}
                    className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${
