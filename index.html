                      authFormTab === 'register' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    📝 New User (Enter Details)
                  </button>
                  <button
                    onClick={() => setAuthFormTab('signin')}
                    className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${
                      authFormTab === 'signin' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    🔑 Returning Sign In
                  </button>
                </div>

                {/* FORM 1: ENTER PERSONAL DETAILS (NAME, EMAIL, PHONE, ROLE) */}
                {authFormTab === 'register' ? (
                  <form onSubmit={handleRegisterUser} className="space-y-4">
                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1">
                        Full Name <span className="text-rose-500">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={inputName}
                        onChange={(e) => setInputName(e.target.value)}
                        placeholder="e.g. Sarthak Sharma"
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1">
                          Email Address <span className="text-rose-500">*</span>
                        </label>
                        <input
                          type="email"
                          required
                          value={inputEmail}
                          onChange={(e) => setInputEmail(e.target.value)}
                          placeholder="sarthak@example.com"
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1">
                          Phone Number <span className="text-rose-500">*</span>
                        </label>
                        <input
                          type="tel"
                          required
                          value={inputPhone}
                          onChange={(e) => setInputPhone(e.target.value)}
                          placeholder="+1 (555) 019-2834"
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1">
                        Primary Role
                      </label>
                      <div className="grid grid-cols-3 gap-2">
                        {['Client', 'Creator', 'Both'].map(r => (
                          <button
                            key={r}
                            type="button"
                            onClick={() => setInputRole(r)}
                            className={`py-2 px-2 text-xs font-bold rounded-xl border transition-all text-center ${
                              inputRole === r
                                ? 'bg-indigo-50 border-indigo-500 text-indigo-700 shadow-xs'
                                : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                            }`}
                          >
                            {r === 'Client' ? '💼 Client' : r === 'Creator' ? '🎨 Creator' : '⚡ Both'}
                          </button>
                        ))}
                      </div>
                      <p className="text-[11px] text-slate-500 mt-1">
                        {inputRole === 'Client'
                          ? 'Discover gigs, book appointments, and track confirmation status.'
                          : inputRole === 'Creator'
                          ? 'Post service gigs, set rates, and accept incoming appointment requests.'
                          : 'Can post gigs as a creator and book appointments as a client.'}
                      </p>
                    </div>

                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1">
                        Headline / Occupation (Optional)
                      </label>
                      <input
                        type="text"
                        value={inputTagline}
                        onChange={(e) => setInputTagline(e.target.value)}
                        placeholder="e.g. Video Producer, Indie Founder, Student"
                        className="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xs font-medium"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black shadow-lg shadow-indigo-100 active:scale-95 transition-all mt-2"
                    >
                      Save Details & Open Marketplace Home →
                    </button>
                  </form>
                ) : (
                  /* FORM 2: RETURNING SIGN IN */
                  <form onSubmit={handleSignInWithIdentifier} className="space-y-4">
                    <div>
                      <label className="block text-xs font-extrabold uppercase tracking-wider text-slate-700 mb-1">
                        Enter Email or Phone Number
                      </label>
                      <input
                        type="text"
                        required
                        value={signInIdentifier}
                        onChange={(e) => setSignInIdentifier(e.target.value)}
                        placeholder="e.g. sarah.chen@creator.io or +1 (415) 555-0142"
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black shadow-lg shadow-indigo-100 active:scale-95 transition-all"
                    >
                      Sign In & Open Marketplace →
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: BOOK APPOINTMENT MODAL (REQ 4.3) */}
          {/* ========================================================= */}
          {bookingTargetGig && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/65 backdrop-blur-xs animate-in fade-in overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-5 my-8">
                
                <div className="flex items-start justify-between gap-4 border-b border-slate-100 pb-4">
                  <div>
                    <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">Appointment Booking</span>
                    <h3 className="text-xl font-black text-slate-900 mt-0.5">Book Creator Service</h3>
                  </div>
                  <button onClick={() => setBookingTargetGig(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">
                    ✕
                  </button>
                </div>

                {/* Gig Summary */}
                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-2">
                  <div className="flex items-center justify-between text-xs">
                    <span className="px-2.5 py-0.5 font-bold rounded-md bg-indigo-100 text-indigo-700">
                      {bookingTargetGig.category}
                    </span>
                    <span className="text-lg font-black text-slate-900">${bookingTargetGig.rate}</span>
                  </div>
                  <h4 className="text-sm font-bold text-slate-900">{bookingTargetGig.title}</h4>
                  <div className="flex items-center gap-2 text-xs text-slate-500 pt-1">
                    <img src={getUser(bookingTargetGig.creator_id).avatar} alt="Creator" className="w-5 h-5 rounded-full object-cover" />
                    <span>Creator: <strong>{getUser(bookingTargetGig.creator_id).name}</strong></span>
                  </div>
                </div>

                <form onSubmit={handleBookAppointmentSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                      Your Full Name <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      value={appointmentForm.name}
                      onChange={(e) => setAppointmentForm({ ...appointmentForm, name: e.target.value })}
                      placeholder="e.g. Sarthak Sharma"
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                        Contact Email <span className="text-rose-500">*</span>
                      </label>
                      <input
                        type="email"
                        required
                        value={appointmentForm.email}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, email: e.target.value })}
                        placeholder="sarthak@example.com"
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                        Phone Number <span className="text-rose-500">*</span>
                      </label>
                      <input
                        type="tel"
                        required
                        value={appointmentForm.phone}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, phone: e.target.value })}
                        placeholder="+1 (555) 019-2834"
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium"
                      />
                    </div>
                  </div>

                  {/* Appointment Date & Slot */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                        Preferred Date <span className="text-rose-500">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={appointmentForm.date}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, date: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                        Preferred Time Slot
                      </label>
                      <select
                        value={appointmentForm.slot}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, slot: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-medium bg-white"
                      >
                        <option value="Morning (9 AM - 12 PM)">Morning (9 AM - 12 PM)</option>
                        <option value="Afternoon (1 PM - 5 PM)">Afternoon (1 PM - 5 PM)</option>
                        <option value="Evening (6 PM - 9 PM)">Evening (6 PM - 9 PM)</option>
                        <option value="Urgent (Within 24h)">Urgent (Within 24h)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                      Project Scope / Appointment Message
                    </label>
                    <textarea
                      rows="3"
                      value={appointmentForm.message}
                      onChange={(e) => setAppointmentForm({ ...appointmentForm, message: e.target.value })}
                      placeholder="Detail your requirements, project links, or questions for the creator..."
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-3">
                    <button
                      type="button"
                      onClick={() => setBookingTargetGig(null)}
                      className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-lg shadow-indigo-100 active:scale-95 transition-all"
                    >
                      Confirm Appointment (Pending) →
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: BOOKING CONFIRMATION (REQ 4.3) */}
          {/* ========================================================= */}
          {bookingConfirmation && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/65 backdrop-blur-xs animate-in fade-in">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-200 text-center space-y-5">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                  ✓
                </div>

                <div className="space-y-1">
                  <span className="text-xs font-bold uppercase tracking-wider text-emerald-600">Booking Confirmed</span>
                  <h3 className="text-2xl font-black text-slate-900">Appointment Request Sent!</h3>
                  <p className="text-xs text-slate-500">
                    Your request has been logged and is currently in <strong>Pending</strong> status.
                  </p>
                </div>

                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-left space-y-2 text-xs">
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium">Booking ID:</span>
                    <span className="font-mono font-bold text-indigo-700">{bookingConfirmation.booking.id}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium">Status:</span>
                    <span className="px-2.5 py-0.5 rounded-full font-bold bg-amber-100 text-amber-800 text-[11px] flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                      Pending Review
                    </span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium">Service:</span>
                    <span className="font-bold text-slate-900 truncate max-w-[200px]">{bookingConfirmation.gig.title}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium">Appointment:</span>
                    <span className="font-bold text-slate-900">{bookingConfirmation.booking.appointment_date} ({bookingConfirmation.booking.appointment_slot})</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-slate-500 font-medium">Client Phone:</span>
                    <span className="font-mono font-bold text-slate-800">{bookingConfirmation.booking.client_phone}</span>
                  </div>
                </div>

                <div className="pt-2 flex flex-col sm:flex-row items-center justify-center gap-2">
                  <button
                    onClick={() => {
                      setBookingConfirmation(null);
                      setCurrentTab('my_bookings');
                    }}
                    className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md shadow-indigo-100"
                  >
                    View in My Bookings →
                  </button>
                  <button
                    onClick={() => setBookingConfirmation(null)}
                    className="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold"
                  >
                    Keep Browsing
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: GIG DETAILS OVERVIEW */}
          {/* ========================================================= */}
          {gigDetailsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs animate-in fade-in">
              <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-6 max-h-[90vh] overflow-y-auto">
                <div className="flex items-start justify-between gap-4 border-b border-slate-100 pb-4">
                  <div>
                    <span className="text-xs font-bold px-2.5 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-100">
                      {gigDetailsModal.category}
                    </span>
                    <h3 className="text-xl font-extrabold text-slate-900 mt-2">
                      {gigDetailsModal.title}
                    </h3>
                  </div>
                  <button onClick={() => setGigDetailsModal(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">
                    ✕
                  </button>
                </div>

                {(() => {
                  const cr = getUser(gigDetailsModal.creator_id);
                  return (
                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <img src={cr.avatar} alt={cr.name} className="w-12 h-12 rounded-full object-cover ring-2 ring-white shadow-xs" />
                        <div>
                          <h4 className="text-sm font-bold text-slate-900">{cr.name}</h4>
                          <p className="text-xs text-slate-500">{cr.tagline}</p>
                          <p className="text-[11px] text-slate-600 font-mono mt-0.5">📱 {cr.phone || 'Phone verified'}</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <span className="text-2xl font-black text-slate-900">${gigDetailsModal.rate}</span>
                        <span className="block text-[11px] text-slate-500 font-medium">Fixed Rate</span>
                      </div>
                    </div>
                  );
                })()}

                <div className="space-y-2">
                  <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-500">Service Description</h4>
                  <p className="text-xs sm:text-sm text-slate-700 leading-relaxed bg-slate-50/50 p-4 rounded-2xl border border-slate-100">
                    {gigDetailsModal.description}
                  </p>
                </div>

                {gigDetailsModal.deliverables && (
                  <div className="space-y-2">
                    <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-500">What's Included</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {gigDetailsModal.deliverables.map((item, i) => (
                        <div key={i} className="flex items-center gap-2 text-xs text-slate-700 bg-white p-2.5 rounded-xl border border-slate-200">
                          <span className="text-emerald-500 font-bold">✓</span>
                          <span>{item}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="pt-2 flex items-center justify-end gap-3 border-t border-slate-100">
                  <button
                    onClick={() => setGigDetailsModal(null)}
                    className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold"
                  >
                    Close
                  </button>
                  {(!currentUser || gigDetailsModal.creator_id !== currentUser.id) ? (
                    <button
                      onClick={() => {
                        const target = gigDetailsModal;
                        setGigDetailsModal(null);
                        handleInitiateBooking(target);
                      }}
                      className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-lg shadow-indigo-100 transition-all"
                    >
                      Book Appointment (${gigDetailsModal.rate}) →
                    </button>
                  ) : (
                    <span className="text-xs text-slate-500 font-medium">This is your service listing</span>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: EDIT GIG MODAL */}
          {/* ========================================================= */}
          {editingGig && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-5">
                <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                  <h3 className="text-lg font-bold text-slate-900">Edit Gig Listing</h3>
                  <button onClick={() => setEditingGig(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  setGigs(prev => prev.map(g => g.id === editingGig.id ? { ...editingGig, rate: Number(editingGig.rate) } : g));
                  setEditingGig(null);
                  showToast('Gig listing updated.');
                }} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Gig Title</label>
                    <input
                      type="text"
                      required
                      value={editingGig.title}
                      onChange={(e) => setEditingGig({ ...editingGig, title: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Category</label>
                      <select
                        value={editingGig.category}
                        onChange={(e) => setEditingGig({ ...editingGig, category: e.target.value })}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium bg-white"
                      >
                        {CATEGORIES.map(c => (
                          <option key={c} value={c}>{c}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Rate ($)</label>
                      <input
                        type="number"
                        min="5"
                        required
                        value={editingGig.rate}
                        onChange={(e) => setEditingGig({ ...editingGig, rate: e.target.value })}
                        className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Description</label>
                    <textarea
                      rows="3"
                      required
                      value={editingGig.description}
                      onChange={(e) => setEditingGig({ ...editingGig, description: e.target.value })}
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setEditingGig(null)}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: HACKATHON DECISION POINTS (THE 20 PTS SECTION) */}
          {/* ========================================================= */}
          {showJudgeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs animate-in fade-in overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-6 my-8">
                
                <div className="flex items-start justify-between gap-4 border-b border-slate-100 pb-4">
                  <div>
                    <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-amber-100 text-amber-900 text-xs font-extrabold uppercase tracking-wide">
                      🏆 Hackathon Rubric • 20 Points
                    </div>
                    <h3 className="text-2xl font-black text-slate-900 mt-1.5">
                      Decision Points & Defensible Rationale
                    </h3>
                  </div>
                  <button onClick={() => setShowJudgeModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">
                    ✕
                  </button>
                </div>

                <div className="space-y-4 text-left">
                  {/* DP1 */}
                  <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-black flex items-center justify-center">1</span>
                      <h4 className="font-extrabold text-sm text-slate-900">DP1 — Rejection Resolution</h4>
                    </div>
                    <p className="text-xs text-slate-700 font-semibold pl-8">
                      <strong>Decision:</strong> Declined bookings remain permanent records marked <strong>Declined</strong> in "My Bookings". The client can immediately re-book the same gig or any other gig without restriction.
                    </p>
                    <div className="pl-8 text-xs text-indigo-950 bg-indigo-50/80 p-3 rounded-xl border border-indigo-100">
                      <strong>Why:</strong> A decline is the creator's call on that specific request (timing, bandwidth, scope) — not a judgment on the client. Blocking or rate-limiting adds arbitrary friction and risks punishing legitimate re-attempts.
                    </div>
                  </div>

                  {/* DP2 */}
                  <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-black flex items-center justify-center">2</span>
                      <h4 className="font-extrabold text-sm text-slate-900">DP2 — Double Booking Resolution</h4>
                    </div>
                    <p className="text-xs text-slate-700 font-semibold pl-8">
                      <strong>Decision:</strong> Yes — a gig can receive multiple simultaneous Pending bookings. No auto-blocking.
                    </p>
                    <div className="pl-8 text-xs text-indigo-950 bg-indigo-50/80 p-3 rounded-xl border border-indigo-100">
                      <strong>Why:</strong> A gig is an ongoing <em>service listing</em>, not a physical calendar slot. Auto-locking upon one pending inquiry would destroy marketplace liquidity; one indecisive client could freeze out every other lead. The creator's dashboard is where triage happens.
                    </div>
                  </div>

                  {/* DP3 */}
                  <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-black flex items-center justify-center">3</span>
                      <h4 className="font-extrabold text-sm text-slate-900">DP3 — Discovery Ranking</h4>
                    </div>
                    <p className="text-xs text-slate-700 font-semibold pl-8">
                      <strong>Decision:</strong> Listings rank by <strong>Newest First</strong>.
                    </p>
                    <div className="pl-8 text-xs text-indigo-950 bg-indigo-50/80 p-3 rounded-xl border border-indigo-100">
                      <strong>Why:</strong> It's the simplest and most equitable rule to implement under hackathon pressure. "Cheapest first" causes a quality race-to-the-bottom, and rotation is opaque. Newest-first directly rewards active creators who keep their listings fresh.
                    </div>
                  </div>

                  <div className="border-t border-slate-200 pt-4 space-y-2 text-xs text-slate-600">
                    <h5 className="font-bold text-slate-800 uppercase tracking-wider text-[11px]">Architectural Assumptions Log</h5>
                    <ul className="list-disc pl-5 space-y-1">
                      <li><strong>Personal Information First:</strong> Users and creators provide their real Name, Email, and Phone Number upon onboarding to facilitate direct contact and booking communication.</li>
                      <li><strong>Appointment Scheduling:</strong> Bookings capture preferred appointment dates and time slots along with project scope.</li>
                      <li><strong>Unified User Entity:</strong> A single user model allows any account to post gigs as a creator and book other gigs as a client.</li>
                    </ul>
                  </div>

                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setShowJudgeModal(false)}
                    className="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold"
                  >
                    Close & Return to Marketplace
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-16 text-slate-500 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-extrabold text-slate-800">SparkGig</span>
                <span>— Creator Gig & Appointment Marketplace</span>
              </div>
              <div className="flex items-center gap-4 text-[11px]">
                <button onClick={() => setShowJudgeModal(true)} className="hover:text-indigo-600 font-bold">
                  Decision Points (DP1–DP3)
                </button>
                <span>•</span>
                <button onClick={() => setShowSwitchUserModal(true)} className="hover:text-indigo-600 font-bold">
                  Personal Details / Switch Account
                </button>
                <span>•</span>
                <span>Doc Owner: Sarthak</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
